<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Contact form</title>
  </head>
  <body>
    <form
      name="contact"
      method="post"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="contact" /><input
        name="bot-field"
      /><input name="name" /><input name="email" type="email" /><select
        name="service"
      >
        <option>General inquiry</option></select
      ><textarea name="message"></textarea>
    </form>
  </body>
</html>
